# Production. Toutes les valeurs sensibles viennent de .env (cf. .env.example).
# Les images sont stockees dans le bucket OVH : aucun volume de fichiers ici.
#
#   cp .env.example .env   # puis renseigner les secrets
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build: ./ecoswitch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=5
      # Aucune valeur par defaut : l'API refuse de demarrer sans secret.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manquant}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL manquant}
      ECOSWITCH_BOOTSTRAP_ADMIN_EMAILS: ${ECOSWITCH_BOOTSTRAP_ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT manquant}
      S3_REGION: ${S3_REGION:-gra}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET manquant}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL manquant}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS manquant}
    deploy:
      resources:
        limits:
          memory: 256M

  ihm:
    build:
      context: ./ecoswitch-ihm
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_HOST: http://api:8080
    ports:
      - "${PORT:-80}:80"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
