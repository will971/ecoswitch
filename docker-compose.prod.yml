# Production. Toutes les valeurs sensibles viennent de .env (cf. .env.example).
#
# Images : RustFS (compatible S3, remplacant de MinIO dont l'image n'est plus
# distribuee) fait partie de la stack ; Nginx le sert sous https://<site>/media/.
# Pour un bucket OVH a la place : renseigner S3_ENDPOINT etc. dans .env et
# S3_AUTO_CREATE_BUCKET=false ; le service s3 peut alors etre retire.
#
#   cp .env.example .env   # puis renseigner les secrets
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  # Stockage d'images compatible S3. Non expose : Nginx le sert sous /media/.
  # Le bucket et sa lecture publique sont crees par l'API au demarrage.
  s3:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build: ./ecoswitch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=5
      # Aucune valeur par defaut : l'API refuse de demarrer sans secret.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manquant}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL manquant}
      ECOSWITCH_BOOTSTRAP_ADMIN_EMAILS: ${ECOSWITCH_BOOTSTRAP_ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      # Par defaut : le RustFS de la stack. Surcharger S3_* pour un bucket OVH.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ecoswitch-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
      # URL vue par le navigateur, ex. https://www.example.fr/media
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL manquant}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS manquant}
    deploy:
      resources:
        limits:
          memory: 256M

  ihm:
    build:
      context: ./ecoswitch-ihm
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_HOST: http://api:8080
      MEDIA_UPSTREAM: http://s3:9000
      MEDIA_BUCKET: ${S3_BUCKET:-ecoswitch-media}
    ports:
      - "${PORT:-80}:80"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  s3_data:
