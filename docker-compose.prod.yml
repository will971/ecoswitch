services:
  postgres:
    image: postgres:16-alpine
    container_name: ecoswitch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoswitch}
      POSTGRES_USER: ${POSTGRES_USER:-ecoswitch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoswitch} -d ${POSTGRES_DB:-ecoswitch}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: ./ecoswitch-api
      dockerfile: Dockerfile
    container_name: ecoswitch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecoswitch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ecoswitch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret_change_me}
      JWT_SECRET: ${JWT_SECRET:-RWNvU3dpdGNoU2VjcmV0S2V5MjAyNlByZW1pdW1BcHBKd3RTZWNVcmVUb2tlbg==}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-ChangeMeAdminPass2026!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M

  ihm:
    build:
      context: ./ecoswitch-ihm
      dockerfile: Dockerfile
    container_name: ecoswitch-ihm
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PORT:-80}:80"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
    driver: local
