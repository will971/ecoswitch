# Pile complete de developpement : base, stockage d'images, API, IHM.
#   make up   ->  IHM http://localhost:3000 | API http://localhost:8080
#                 Images http://localhost:3000/media/...
#
# Ports de l'hote modifiables si 3000 ou 8080 sont deja pris :
#   IHM_PORT=3300 API_PORT=8180 make up
#
# Valeurs de developpement uniquement. La production utilise
# docker-compose.prod.yml et un fichier .env.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecoswitch
      POSTGRES_USER: ecoswitch
      POSTGRES_PASSWORD: ecoswitch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoswitch -d ecoswitch"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Stockage d'images compatible S3 (RustFS). MinIO n'est plus distribue en
  # image Docker. Le bucket est cree par l'API au demarrage
  # (S3_AUTO_CREATE_BUCKET). Non expose : Nginx sert les images sous /media/.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ecoswitch
      RUSTFS_SECRET_KEY: ecoswitch-dev-secret
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./ecoswitch-api
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecoswitch:ecoswitch@postgres:5432/ecoswitch?schema=public
      BETTER_AUTH_SECRET: dev-only-secret-change-me-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:${API_PORT:-8080}
      ECOSWITCH_BOOTSTRAP_ADMIN_EMAILS: ${ECOSWITCH_BOOTSTRAP_ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_BUCKET: ecoswitch-media
      S3_ACCESS_KEY: ecoswitch
      S3_SECRET_KEY: ecoswitch-dev-secret
      S3_AUTO_CREATE_BUCKET: "true"
      # URL vue par le NAVIGATEUR : Nginx de l'IHM relaie /media/ vers RustFS,
      # exactement comme en production.
      S3_PUBLIC_BASE_URL: http://localhost:${IHM_PORT:-3000}/media
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "${API_PORT:-8080}:8080"

  ihm:
    build:
      context: ./ecoswitch-ihm
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - api
    environment:
      API_HOST: http://api:8080
      MEDIA_UPSTREAM: http://s3:9000
      MEDIA_BUCKET: ecoswitch-media
    ports:
      - "${IHM_PORT:-3000}:80"

volumes:
  pgdata:
  s3data:
