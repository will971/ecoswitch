  </defs>
  <rect width="300" height="160" rx="14" fill="url(#bgGrad)"/>
  <line x1="15" y1="125" x2="285" y2="125" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6,6"/>
  
