<!doctype html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Connexion - Supervision EcoSwitch</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--font-sans: 'Inter', sans-serif;
			--font-heading: 'Outfit', sans-serif;

			/* HSL Color System */
			--bg-deep: 224 47% 4%;
			--bg-card: 223 47% 8%;
			--bg-glass: 223 47% 8% / 0.65;
			--border-glass: 223 30% 16% / 0.5;
			--border-glass-focus: 187 92% 45% / 0.5;

			/* Brand Glow Accents */
			--accent-teal: 162 72% 48%;     /* #14b8a6 */
			--accent-cyan: 187 92% 45%;     /* #0891b2 */
			--accent-rose: 343 82% 58%;     /* #e11d48 */

			/* Text states */
			--text-main: 220 20% 97%;
			--text-muted: 217 12% 70%;
			--text-dimmed: 218 8% 45%;

			--bg-hover: 255 255 255 / 0.03;
		}

		[data-theme="light"] {
			/* HSL Color System - Light Mode */
			--bg-deep: 220 20% 96%;          /* light grey/blue background */
			--bg-card: 0 0% 100%;            /* pure white */
			--bg-glass: 0 0% 100% / 0.8;     /* white semi-transparent card */
			--border-glass: 220 20% 84% / 0.9; /* subtle light border */
			--border-glass-focus: 187 92% 40% / 0.5;

			/* Accent adjustments (darker/more saturated for high contrast on light bg) */
			--accent-teal: 162 80% 32%;      /* highly readable teal */
			--accent-cyan: 187 90% 32%;
			--accent-rose: 343 85% 45%;

			/* Text states - Light Mode */
			--text-main: 224 47% 12%;        /* very dark slate */
			--text-muted: 220 15% 32%;       /* slate grey */
			--text-dimmed: 220 12% 48%;      /* readable light slate */

			--bg-hover: 0 0 0 / 0.04;
		}
	</style>

	<script>
		// Gestion du Thème Clair / Sombre immédiate pour éviter le flash
		function getSystemTheme() {
			return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
		}

		function applyTheme(theme) {
			document.documentElement.setAttribute('data-theme', theme);
			const btn = document.getElementById('themeToggleBtn');
			if (btn) {
				btn.textContent = theme === 'light' ? '🌙' : '☀️';
				btn.title = theme === 'light' ? 'Activer le mode sombre' : 'Activer le mode clair';
			}
		}

		function toggleTheme() {
			const current = document.documentElement.getAttribute('data-theme') || 'dark';
			const next = current === 'light' ? 'dark' : 'light';
			localStorage.setItem('ecoswitch_theme', next);
			applyTheme(next);
		}

		function initTheme() {
			const saved = localStorage.getItem('ecoswitch_theme');
			if (saved === 'light' || saved === 'dark') {
				applyTheme(saved);
			} else {
				applyTheme(getSystemTheme());
			}

			window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
				if (!localStorage.getItem('ecoswitch_theme')) {
					applyTheme(e.matches ? 'light' : 'dark');
				}
			});
		}

		initTheme();

		document.addEventListener('DOMContentLoaded', () => {
			const current = document.documentElement.getAttribute('data-theme') || 'dark';
			applyTheme(current);
		});
	</script>

	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: var(--font-sans);
			background-color: hsl(var(--bg-deep));
			color: hsl(var(--text-main));
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			-webkit-font-smoothing: antialiased;
			padding: 16px;
		}

		/* Decorative glowing ambient blobs */
		.glow-blob {
			position: absolute;
			border-radius: 50%;
			filter: blur(100px);
			z-index: 1;
			opacity: 0.15;
		}

		.glow-blob-1 {
			width: 300px;
			height: 300px;
			background: hsl(var(--accent-cyan));
			top: -50px;
			left: -50px;
		}

		.glow-blob-2 {
			width: 350px;
			height: 350px;
			background: hsl(var(--accent-teal));
			bottom: -80px;
			right: -80px;
		}

		.login-container {
			width: 100%;
			max-width: 400px;
			z-index: 10;
		}

		.card-glass {
			background: hsl(var(--bg-glass));
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border: 1px solid hsl(var(--border-glass));
			border-radius: 16px;
			padding: 32px;
			box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.8);
			transition: all 0.3s ease;
		}

		.glow-cyan {
			box-shadow: 0 0 30px 0 hsl(var(--accent-cyan) / 0.12);
		}

		.logo-area {
			text-align: center;
			margin-bottom: 28px;
		}

		.lock-icon-wrapper {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 56px;
			height: 56px;
			background: hsl(var(--bg-deep) / 0.6);
			border: 1px solid hsl(var(--border-glass));
			border-radius: 50%;
			margin-bottom: 16px;
			font-size: 1.5rem;
			box-shadow: 0 0 15px 0 hsl(var(--accent-cyan) / 0.2);
		}

		h2 {
			font-family: var(--font-heading);
			font-size: 1.5rem;
			font-weight: 600;
			letter-spacing: -0.025em;
			margin-bottom: 6px;
			background: linear-gradient(135deg, hsl(var(--text-main)) 30%, hsl(var(--accent-cyan)) 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		.badge {
			display: inline-flex;
			align-items: center;
			font-size: 0.65rem;
			font-weight: 700;
			padding: 4px 10px;
			border-radius: 20px;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			background: hsl(var(--accent-cyan) / 0.15);
			color: hsl(var(--accent-cyan));
			border: 1px solid hsl(var(--accent-cyan) / 0.25);
		}

		/* Form elements */
		.form-group {
			margin-bottom: 20px;
		}

		.form-label {
			display: block;
			font-size: 0.75rem;
			font-weight: 600;
			margin-bottom: 6px;
			color: hsl(var(--text-muted));
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.form-control {
			width: 100%;
			padding: 12px 16px;
			background: hsl(var(--bg-deep) / 0.6);
			border: 1px solid hsl(var(--border-glass));
			border-radius: 10px;
			color: hsl(var(--text-main));
			font-family: var(--font-sans);
			font-size: 0.95rem;
			outline: none;
			transition: all 0.2s ease;
		}

		.form-control:focus {
			border-color: hsl(var(--accent-cyan));
			box-shadow: 0 0 0 3px hsl(var(--border-glass-focus));
			background: hsl(var(--bg-deep) / 0.95);
		}

		/* Error message alert */
		.error-alert {
			background: hsl(var(--accent-rose) / 0.15);
			border: 1px solid hsl(var(--accent-rose) / 0.3);
			color: hsl(var(--accent-rose));
			font-size: 0.8rem;
			padding: 12px;
			border-radius: 8px;
			margin-bottom: 20px;
			display: flex;
			align-items: center;
			gap: 8px;
			font-weight: 500;
		}

		/* Button styles */
		.btn {
			width: 100%;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			font-family: var(--font-heading);
			font-weight: 600;
			font-size: 0.95rem;
			padding: 12px 24px;
			border-radius: 10px;
			border: 1px solid transparent;
			cursor: pointer;
			transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
		}

		.btn-primary {
			background: linear-gradient(135deg, hsl(var(--accent-teal)) 0%, hsl(var(--accent-cyan)) 100%);
			color: hsl(var(--bg-deep));
		}

		.btn-primary:hover {
			box-shadow: 0 0 25px 0 hsl(var(--accent-cyan) / 0.35);
			transform: translateY(-1px);
		}

		.back-link {
			text-align: center;
			margin-top: 24px;
		}

		.back-link a {
			color: hsl(var(--text-dimmed));
			text-decoration: none;
			font-size: 0.8rem;
			transition: all 0.2s ease;
		}

		.back-link a:hover {
			color: hsl(var(--accent-cyan));
		}
	</style>
</head>

<body>
	<!-- Glowing design backgrounds -->
	<div class="glow-blob glow-blob-1"></div>
	<div class="glow-blob glow-blob-2"></div>

	<div class="login-container">
		<main class="card-glass glow-cyan" style="position: relative;">
			<!-- Theme Toggle Button -->
			<button id="themeToggleBtn" onclick="toggleTheme()" style="position: absolute; top: 16px; right: 16px; background: transparent; border: none; font-size: 1.1rem; cursor: pointer; outline: none; user-select: none;" title="Changer le thème">
				🌓
			</button>
			<div class="logo-area">
				<div class="lock-icon-wrapper">🔒</div>
				<h2>Supervision API</h2>
				<span class="badge">Console de Diagnostic</span>
			</div>

			<!-- Dynamic credentials error check -->
			<div id="errorAlert" class="error-alert" style="display: none;">
				⚠️ Identifiants de supervision incorrects. Veuillez réessayer.
			</div>

			<form method="POST" action="/admin/login">
				<div class="form-group">
					<label class="form-label">Identifiant Administrateur</label>
					<input type="text" name="username" class="form-control" placeholder="ex: admin" required autofocus autocomplete="username">
				</div>
				<div class="form-group">
					<label class="form-label">Mot de passe</label>
					<input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
				</div>
				
				<button type="submit" class="btn btn-primary">
					Se connecter ⚡
				</button>
			</form>
		</main>

		<div class="back-link">
			<a id="publicAppBackLink" href="https://ecoswich.up.railway.app/">&larr; Retourner sur le simulateur public</a>
		</div>
	</div>

	<script>
		// Resolution dynamique du lien de retour vers le front
		document.addEventListener('DOMContentLoaded', () => {
			const link = document.getElementById('publicAppBackLink');
			if (link) {
				const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
				if (isLocal) {
					link.href = 'http://localhost:5173/';
				} else {
					link.href = 'https://ecoswich.up.railway.app/';
				}
			}
		});

		// Show error alert dynamically if Spring Security query param contains '?error'
		if (window.location.search.includes('error')) {
			document.getElementById('errorAlert').style.display = 'flex';
		}
	</script>
</body>

</html>
