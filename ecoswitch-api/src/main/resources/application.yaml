server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/xml

spring:
  application:
    name: springboot-app
  jpa:
    hibernate:
      ddl-auto: create-drop   # H2 en mémoire en local : tables créées au démarrage
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  file:
    name: logs/application.log

app:
  admin:
    log-directory: logs
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin}
  seed:
    vehicles-file: classpath:data/vehicules-seed.csv
    vehicles-url: https://raw.githubusercontent.com/williamsmodeste/antigravity-auto-db/main/vehicles.json
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    jwt:
      # Clé HMAC-SHA256 encodée en Base64 (256 bits minimum)
      secret: ${JWT_SECRET:RWNvU3dpdGNoU2VjcmV0S2V5MjAyNlByZW1pdW1BcHBKd3RTZWNVcmVUb2tlbg==}
      expiration-days: 7
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}

