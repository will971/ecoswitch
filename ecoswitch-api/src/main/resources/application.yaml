spring:
  application:
    name: springboot-app
  jpa:
    hibernate:
      ddl-auto: create-drop   # H2 en mémoire : tables créées au démarrage
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  file:
    name: logs/application.log

